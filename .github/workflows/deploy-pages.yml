name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build public site
    runs-on: ubuntu-latest
    env:
      DEPLOY_BASE_PATH: ${{ vars.DEPLOY_BASE_PATH || '/business-japanese-hub/' }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_EDGE_FUNCTIONS_BASE_URL: ${{ vars.VITE_EDGE_FUNCTIONS_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.115.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Check Edge Function entrypoints
        run: deno check supabase/functions/*/index.ts

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Start clean local database
        run: supabase db start

      - name: Apply migrations from scratch
        run: supabase db reset --local

      - name: Test transactional database contracts
        run: supabase test db --local supabase/tests

      - name: Lint database schema
        run: supabase db lint --local --schema public --level warning --fail-on error

      - name: Build Pages artifact
        run: pnpm build:pages

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy public site
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout smoke-test script
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Smoke deployed public routes
        run: pnpm exec tsx scripts/smoke-pages.ts "${{ steps.deployment.outputs.page_url }}"
