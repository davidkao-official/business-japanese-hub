name: Deploy Supabase production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the Supabase CLI used by database validation
        shell: bash
        run: |
          version=2.115.0
          cli_dir="$(mktemp -d "$RUNNER_TEMP/supabase-cli.XXXXXX")"
          archive="$cli_dir/supabase.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/supabase/cli/releases/download/v${version}/supabase_${version}_linux_amd64.tar.gz"
          echo "ff099608ce758b625532ef03a61f4c9520b995e94ff6cd5480dc0428cad64cb3  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$cli_dir" supabase supabase-go
          echo "$cli_dir" >> "$GITHUB_PATH"

      - name: Apply migrations and deploy Edge Functions
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: apndyhorzaxgdbipbecq
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "::error::Missing SUPABASE_ACCESS_TOKEN in the production environment."
            exit 1
          fi

          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase migration list --linked
          supabase db push --linked --yes
          supabase migration list --linked --output json | jq -e '
            .,
            (.migrations | if all(.[]; .local == "" or .local == .remote)
              then true
              else error("Local migrations are missing remotely")
              end)
          '

          for entrypoint in supabase/functions/*/index.ts; do
            function_dir="${entrypoint%/index.ts}"
            supabase functions deploy "${function_dir##*/}" \
              --project-ref "$SUPABASE_PROJECT_REF" --use-api --jobs 1 --yes
          done

      - name: Smoke both Cloudflare Pages deployments
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          smoke() {
            for attempt in {1..12}; do
              if pnpm smoke:deployment "$1" "$2" "$EXPECTED_SHA"; then
                return 0
              fi
              if [[ "$attempt" -lt 12 ]]; then
                sleep 30
              fi
            done
            return 1
          }

          status=0
          smoke https://business-japanese-hub.pages.dev/ library || status=1
          smoke https://business-japanese-career-game.pages.dev/ career-game || status=1
          exit "$status"
