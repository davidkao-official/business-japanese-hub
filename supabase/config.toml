# Supabase project config (https://supabase.com/docs/guides/cli/config)
# Minimal config for the payment Edge Functions. Ingress `verify_jwt` contract:
#   - checkout / orders-status / finance → platform JWT gate ON
#   - provider callbacks / browser returns → platform JWT gate OFF; callbacks
#     self-verify provider authenticity and browser returns are state-neutral
#   - repair-reconcile → gate OFF; the ONLY authorization is the shared
#     scheduled-job secret header checked inside the handler.
project_id = "business-japanese-hub"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[functions]
enabled = true
verify_jwt = true

[functions.checkout]
verify_jwt = true

[functions.orders-status]
verify_jwt = true

[functions.finance]
verify_jwt = true

[functions.repair-reconcile]
verify_jwt = false

[functions.ecpay-callback]
verify_jwt = false

[functions.ecpay-browser-return]
verify_jwt = false

[functions.paypal-webhook]
verify_jwt = false

[functions.paypal-browser-return]
verify_jwt = false
